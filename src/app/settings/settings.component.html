<mat-card>
  <app-loading *ngIf="isLoading | async"></app-loading>

  <mat-card-header>
    <mat-card-title>
      SFin - Settings
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field>
      <mat-label>Pix Column Offset</mat-label>
      <input matInput type="number" min="0" name="pixColumnOffset" [(ngModel)]="settings.columnOffsets['pix']">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Comprovante Column Offset</mat-label>
      <input matInput type="number" min="0" name="comprovanteColumnOffset" [(ngModel)]="settings.columnOffsets['comprovante']">
    </mat-form-field>

    <p *ngIf="message">{{ message }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="accent" (click)="save()">Save</button>
  </mat-card-actions>
</mat-card>
