<mat-card>
  <app-loading *ngIf="isLoading | async"></app-loading>

  <mat-card-header>
    <mat-card-title>
      SFin - Settings
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field>
      <mat-label>Column Offset</mat-label>
      <input matInput type="number" min="0" name="columnOffset" [(ngModel)]="settings.columnOffset">
    </mat-form-field>

    <p *ngIf="message">{{ message }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="accent" (click)="save()">Save</button>
  </mat-card-actions>
</mat-card>
